suite: sandbox proxy isolation
templates:
  - templates/sandbox-proxy.yaml
release:
  name: openshell
  namespace: openshell
tests:
  - it: does not deploy the proxy by default
    asserts:
      - hasDocuments:
          count: 0
  - it: deploys a separate application listener without a Kubernetes API token
    values:
      - ../ci/values-sandbox-proxy.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - contains:
          path: spec.template.spec.containers[0].args
          content: --workspace=default
      - contains:
          path: spec.template.spec.containers[0].args
          content: --allow-plaintext-development
      - notExists:
          path: spec.template.spec.volumes
  - it: projects only the discovery credential and gateway CA in production
    set:
      sandboxProxy.enabled: true
      sandboxProxy.gatewayEndpoint: https://gateway.example.com
      sandboxProxy.discoveryTokenSecret: router-read-token
      sandboxProxy.gatewayCaSecret: gateway-ca
    documentIndex: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --discovery-token-file=/discovery/token
      - equal:
          path: spec.template.spec.volumes[0].secret
          value:
            secretName: router-read-token
            items:
              - key: token
                path: token
      - equal:
          path: spec.template.spec.volumes[1].secret
          value:
            secretName: gateway-ca
            items:
              - key: ca.crt
                path: ca.crt

  - it: mounts only the client certificate pair for mTLS discovery
    set:
      sandboxProxy.enabled: true
      sandboxProxy.gatewayEndpoint: https://gateway.example.com
      sandboxProxy.discoveryClientTlsSecret: proxy-client-tls
      sandboxProxy.gatewayCaSecret: gateway-ca
    documentIndex: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --discovery-client-cert=/discovery/tls.crt
      - contains:
          path: spec.template.spec.containers[0].args
          content: --discovery-client-key=/discovery/tls.key
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --discovery-token-file=/discovery/token
      - equal:
          path: spec.template.spec.volumes[0].secret
          value:
            secretName: proxy-client-tls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
  - it: rejects ambiguous bearer and certificate identities
    set:
      sandboxProxy.enabled: true
      sandboxProxy.discoveryTokenSecret: token
      sandboxProxy.discoveryClientTlsSecret: client-tls
    asserts:
      - failedTemplate:
          errorMessage: sandboxProxy discoveryTokenSecret and discoveryClientTlsSecret are mutually exclusive
