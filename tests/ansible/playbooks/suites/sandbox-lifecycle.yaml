---
# Runs the testkit sandbox-lifecycle suite against the gateway the installer
# registered. testkit finds that gateway the way the CLI does, so no target
# file is needed.
- name: Run the sandbox lifecycle suite
  hosts: all
  gather_facts: false
  vars:
    suite_root: /var/lib/openshell-sandbox-lifecycle/tests
    # Fail when the run executes fewer tests than this, so a dropped or
    # filtered-out test cannot pass silently. Raise it when a test is added.
    suite_expected_tests: 1
    suite_failed: >-
      {{ gateway_status is failed or suite_result.rc != 0 or
         (suite_tests_run | int) < (suite_expected_tests | int) }}
    suite_tests_run: >-
      {{ (suite_result.stderr | default('') | regex_findall('Summary \[[^\]]*\]\s+(\d+) tests? run') | first | default(0)) }}
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Create suite directory
      become: true
      ansible.builtin.file:
        path: "{{ suite_root }}"
        state: directory
        owner: tmachine
        group: tmachine
        mode: "0700"

    - name: Extract suite bundle
      become: true
      ansible.builtin.unarchive:
        src: "{{ sandbox_lifecycle_test_bundle }}"
        dest: "{{ suite_root }}"
        owner: tmachine
        group: tmachine

    - name: Check suite nextest archive
      ansible.builtin.stat:
        path: "{{ suite_root }}/tests.tar.zst"
      register: suite_archive

    - name: Require suite nextest archive
      ansible.builtin.assert:
        that:
          - suite_archive.stat.isreg | default(false)
        fail_msg: Sandbox lifecycle test bundle did not contain tests.tar.zst

    - name: Resolve installed OpenShell CLI
      ansible.builtin.command:
        argv:
          - /bin/sh
          - -c
          - command -v openshell
      register: openshell_cli
      changed_when: false

    # Report a gateway that never came up as one environment failure instead of
    # as every test failing.
    - name: Wait for the registered gateway
      ansible.builtin.command:
        argv: [timeout, 10s, "{{ openshell_cli.stdout }}", status, --output, json]
      register: gateway_status
      changed_when: false
      until: >-
        gateway_status.rc == 0 and
        (gateway_status.stdout | from_json).status == 'connected'
      retries: 60
      delay: 5
      ignore_errors: true

    # The bundle carries no nextest config, so set the timeouts here. A hung
    # test is killed after two minutes instead of holding the lane until the job
    # times out.
    - name: Write nextest config
      ansible.builtin.copy:
        dest: "{{ suite_root }}/nextest.toml"
        mode: "0600"
        content: |
          [profile.default]
          slow-timeout = { period = "30s", terminate-after = 4 }
      become: true
      become_user: tmachine

    - name: Run the suite
      ansible.builtin.command:
        argv:
          - cargo-nextest
          - nextest
          - run
          - --config-file
          - "{{ suite_root }}/nextest.toml"
          - --archive-file
          - "{{ suite_root }}/tests.tar.zst"
          - --workspace-remap
          - "{{ suite_root }}"
          - --no-capture
          # Tests share one gateway and the guest has 4 GiB; run them serially
          # whatever --no-capture implies.
          - --test-threads
          - "1"
          - --no-fail-fast
      environment:
        HOME: /home/tmachine
        OPENSHELL_BIN: "{{ openshell_cli.stdout }}"
      register: suite_result
      changed_when: false
      failed_when: false
      when: gateway_status is succeeded

    - name: Show suite diagnostics
      ansible.builtin.debug:
        var: suite_result
      when: suite_failed | bool

    - name: Collect OpenShell gateway diagnostics
      ansible.builtin.include_role:
        name: openshell_diagnostics
      when: suite_failed | bool

    - name: Require a connected gateway
      ansible.builtin.assert:
        that:
          - gateway_status is succeeded
        fail_msg: OpenShell gateway did not connect before the suite; see gateway diagnostics

    - name: Require suite success
      ansible.builtin.assert:
        that:
          - suite_result.rc == 0
        fail_msg: Sandbox lifecycle suite failed

    - name: Require the expected number of tests
      ansible.builtin.assert:
        that:
          - (suite_tests_run | int) >= (suite_expected_tests | int)
        fail_msg: >-
          Sandbox lifecycle suite ran {{ suite_tests_run }} tests; expected at
          least {{ suite_expected_tests }}
