---
# Runs a testkit suite from a nextest archive against the gateway the installer
# registered. testkit finds that gateway the way the CLI does, so no target file
# is needed. Inputs: suite_bundle, suite_name, suite_expected_tests, and an
# optional suite_filter.
- name: Run a testkit suite
  hosts: all
  gather_facts: false
  vars:
    suite_failed: >-
      {{ gateway_status is failed or
         (controller_readiness_failed | default(false)) or
         suite_result.rc != 0 or
         (suite_tests_run | int) < (suite_expected_tests | int) }}
    suite_tests_run: >-
      {{ (suite_result.stderr | default('') | regex_findall('Summary \\[[^\\]]*\\]\\s+(\\d+) tests? run') | first | default(0)) }}
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:

    - name: Install suite dependencies
      become: true
      ansible.builtin.package:
        name:
          - git
        state: present

    - name: Create the suite test directory
      become: true
      ansible.builtin.file:
        path: /var/lib/openshell-suite/{{ suite_name }}
        state: directory
        owner: tmachine
        group: tmachine
        mode: "0700"

    - name: Extract the suite test bundle
      become: true
      ansible.builtin.unarchive:
        src: "{{ suite_bundle }}"
        dest: /var/lib/openshell-suite/{{ suite_name }}
        owner: tmachine
        group: tmachine

    # Report a malformed outer bundle directly instead of failing later with
    # an opaque cargo-nextest missing-archive error.
    - name: Check the suite nextest archive
      ansible.builtin.stat:
        path: /var/lib/openshell-suite/{{ suite_name }}/tests.tar.zst
      register: suite_archive

    - name: Require the suite nextest archive
      ansible.builtin.assert:
        that:
          - suite_archive.stat.isreg | default(false)
        fail_msg: the suite test bundle did not contain tests.tar.zst

    - name: Resolve installed OpenShell CLI
      ansible.builtin.command:
        argv:
          - /bin/sh
          - -c
          - command -v openshell
      register: openshell_cli
      changed_when: false

    # Every test boot restarts the gateway, and some installers take minutes to
    # recover. Wait once here; the runner's per-scenario preflight stays short.
    - name: Wait for the registered gateway
      ansible.builtin.command:
        argv: [timeout, 10s, "{{ openshell_cli.stdout }}", status, --output, json]
      register: gateway_status
      changed_when: false
      until: >-
        gateway_status.rc == 0 and
        (gateway_status.stdout | from_json).status == 'connected'
      retries: 60
      delay: 5
      ignore_errors: true

    - name: Check for K3s
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: suite_k3s

    - name: Prepare the Kubernetes controller
      when: gateway_status is succeeded and suite_k3s.stat.exists
      block:
        - name: Verify Agent Sandbox reconciliation
          ansible.builtin.include_tasks: k3s-ready.yaml
      rescue:
        - name: Record controller readiness failure
          ansible.builtin.set_fact:
            controller_readiness_failed: true

    # The bundle carries no nextest config, so set the timeouts here. A hung
    # test is killed after two minutes instead of holding the lane until the job
    # times out.
    - name: Write nextest config
      become: true
      become_user: tmachine
      ansible.builtin.copy:
        dest: "/var/lib/openshell-suite/{{ suite_name }}/nextest.toml"
        mode: "0600"
        content: |
          [profile.default]
          slow-timeout = { period = "30s", terminate-after = 4 }

          [profile.default.junit]
          path = "junit.xml"

    - name: Run the suite archive
      ansible.builtin.command:
        argv:
          - cargo-nextest
          - nextest
          - run
          - --config-file
          - /var/lib/openshell-suite/{{ suite_name }}/nextest.toml
          - --archive-file
          - /var/lib/openshell-suite/{{ suite_name }}/tests.tar.zst
          - --workspace-remap
          - /var/lib/openshell-suite/{{ suite_name }}
          - --no-capture
          # The guest has 4 GiB; keep sandbox creates from competing for it.
          - --test-threads
          - "1"
          - --filterset
          - "{{ suite_filter | default('all()') }}"
          - --no-fail-fast
      environment:
        HOME: /home/tmachine
        OPENSHELL_BIN: "{{ openshell_cli.stdout }}"
      register: suite_result
      changed_when: false
      failed_when: false
      when: gateway_status is succeeded and not (controller_readiness_failed | default(false))

    # Keep the JUnit report with the run. The integration runner uploads
    # artifacts/tmachine-diagnostics whether or not the lane passes.
    - name: Find the JUnit report
      ansible.builtin.find:
        paths: "/var/lib/openshell-suite/{{ suite_name }}"
        patterns: junit.xml
        recurse: true
      register: suite_junit
      failed_when: false

    - name: Fetch the JUnit report
      ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "{{ playbook_dir }}/../../../../../artifacts/tmachine-diagnostics/junit/{{ suite_name }}-{{ inventory_hostname }}.xml"
        flat: true
      loop: "{{ suite_junit.files | default([]) }}"
      failed_when: false

    # Preserve both streams for failures without adding passing-test output to
    # every tmachine run.
    - name: Show the suite diagnostics
      ansible.builtin.debug:
        var: suite_result
      when: suite_failed

    - name: Collect OpenShell gateway diagnostics
      ansible.builtin.include_role:
        name: openshell_diagnostics
      when: suite_failed

    - name: Require a connected gateway
      ansible.builtin.assert:
        that:
          - gateway_status is succeeded
        fail_msg: OpenShell gateway did not connect before the suite; see gateway diagnostics

    - name: Require a ready Kubernetes controller
      ansible.builtin.assert:
        that:
          - not (controller_readiness_failed | default(false))
        fail_msg: Agent Sandbox reconciliation did not become ready before the suite; see controller diagnostics

    - name: Require the suite success
      ansible.builtin.assert:
        that:
          - suite_result.rc == 0
        fail_msg: the suite test failed

    - name: Require the expected number of tests
      ansible.builtin.assert:
        that:
          - (suite_tests_run | int) >= (suite_expected_tests | int)
        fail_msg: >-
          Suite {{ suite_name }} ran {{ suite_tests_run }} tests; expected at
          least {{ suite_expected_tests }}
