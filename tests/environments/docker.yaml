# Docker-backed environments, by Evan Lezar (NVIDIA/OpenShell#4629).
#
# The ID must equal <backend>.<os><version without dots>-<arch>.<runtime>.<installer>.
# `tmachine` names the environment and installer in tests/tmachine/config.nix
# that provision it. `gateway` is the name the installer registers the gateway
# under with the CLI (`openshell gateway add --name`); the packaged installers
# register `openshell`. `capabilities` is what the environment gives tests; see
# tests/testkit/README.md.
environments:
  - id: tmachine.ubuntu2404-amd64.docker-rootful.deb
    backend: tmachine
    machine: { os: ubuntu, version: "24.04", arch: amd64 }
    runtime: docker-rootful
    installer: deb
    tmachine: { environment: ubuntu-docker-rootful, installer: deb }
    gateway: openshell
    capabilities: { compute_driver: docker, rootless: false, gpu: false, persistent_workspace: true }
  - id: tmachine.ubuntu2404-arm64.docker-rootful.deb
    backend: tmachine
    machine: { os: ubuntu, version: "24.04", arch: arm64 }
    runtime: docker-rootful
    installer: deb
    tmachine: { environment: ubuntu-docker-rootful, installer: deb }
    gateway: openshell
    capabilities: { compute_driver: docker, rootless: false, gpu: false, persistent_workspace: true }
