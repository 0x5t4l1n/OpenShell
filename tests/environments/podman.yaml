# RPMs are built for x86_64 only, so Podman environments are amd64 only.
environments:
  - id: tmachine.fedora44-amd64.podman-rootful.rpm
    backend: tmachine
    machine: { os: fedora, version: "44", arch: amd64 }
    runtime: podman-rootful
    installer: rpm
    tmachine: { environment: fedora-podman-rootful, installer: rpm }
    capabilities: { compute_driver: podman, rootless: false, gpu: false, persistent_workspace: true }
  - id: tmachine.fedora44-amd64.podman-rootless.rpm
    backend: tmachine
    machine: { os: fedora, version: "44", arch: amd64 }
    runtime: podman-rootless
    installer: rpm
    tmachine: { environment: fedora-podman-rootless, installer: rpm }
    capabilities: { compute_driver: podman, rootless: true, gpu: false, persistent_workspace: true }
