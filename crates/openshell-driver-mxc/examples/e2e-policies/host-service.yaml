version: 1
filesystem_policy:
  include_workdir: false
  read_only: []
  read_write:
    - "C:/work/openshell-mxc-e2e"
network_policies:
  host_service:
    name: host-service
    endpoints:
      - host: 127.0.0.1
        port: __HOST_SERVICE_PORT__
    binaries:
      - path: '__CURL_EXE__'
